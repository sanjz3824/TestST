<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#18181B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StockTrack">
  <link rel="manifest" href="./manifest.json">
  <title>NSE Stock Portfolio Tracker</title>
  
  <!-- Claude Font Integration -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@500;700;800&family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,600&display=swap" rel="stylesheet">

  <style>
    /* Dark Theme (Default) */
    html[data-theme="dark"] {
      --primary: #18181B;
      --surface: #09090B;
      --card-bg: #141417;
      --text: #F4F4F5;
      --muted: #A1A1AA;
      --border: #27272A;
      --success: #3B82F6; /* Blue for Profit */
      --danger: #EF4444;  /* Red for Loss */
      --header-bg: #09090B;
      --tag-bg: #27272A;
    }

    /* Light Theme */
    html[data-theme="light"] {
      --primary: #F4F4F5;
      --surface: #FAFAFA;
      --card-bg: #FFFFFF;
      --text: #18181B;
      --muted: #71717A;
      --border: #E4E4E7;
      --success: #2563EB; /* Blue for Profit */
      --danger: #DC2626;  /* Red for Loss */
      --header-bg: #18181B;
      --tag-bg: #F4F4F5;
    }

    :root {
      --radius: 10px;
      --shadow: 0 2px 6px rgba(0,0,0,0.06);
      --font-claude-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'Inconsolata', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-sans);
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: 70px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .claude-serif { font-family: var(--font-claude-serif); }

    /* Global Header */
    header.global-header {
      background: var(--header-bg);
      color: #FFF;
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    header.global-header h1 { 
      font-family: var(--font-claude-serif); 
      font-size: 16px; 
      font-weight: 700; 
      color: #FFFFFF; 
    }
    
    .header-actions { display: flex; align-items: center; gap: 6px; }

    .theme-toggle-btn {
      background: #27272A;
      border: 1px solid #3F3F46;
      color: #FFF;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Container for Mobile Screens */
    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      padding: 8px 10px; 
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-title { 
      font-family: var(--font-claude-serif); 
      font-size: 12px; 
      font-weight: 700; 
      color: var(--muted); 
      text-transform: uppercase; 
      letter-spacing: 0.6px; 
    }

    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hero-item { padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
    .hero-label { font-size: 9px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
    .hero-value { font-size: 18px; font-weight: 800; font-family: var(--font-mono); color: var(--text); line-height: 1.1; }
    .hero-value.sm { font-size: 14px; }

    /* Dynamic Colors */
    .val-blue, .pnl-blue { color: var(--success) !important; }
    .val-red, .pnl-red { color: var(--danger) !important; }

    .ticker-group { 
      border: 1px solid var(--border); 
      border-radius: var(--radius); 
      margin-bottom: 8px; 
      overflow: hidden; 
      background: var(--card-bg); 
    }
    .ticker-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 8px 10px; 
      background: var(--surface); 
      border-bottom: 1px solid var(--border); 
    }
    .ticker-name { font-family: var(--font-claude-serif); font-size: 14px; font-weight: 700; color: var(--text); }
    .ticker-total { font-family: var(--font-mono); font-size: 12px; font-weight: 800; }

    .broker-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 8px 10px; 
      border-bottom: 1px solid var(--border); 
      cursor: pointer; 
    }
    .broker-row:last-child { border-bottom: none; }
    .broker-row:active { opacity: 0.8; }
    .broker-tag { display: inline-block; font-size: 9px; font-weight: 800; background: var(--tag-bg); color: var(--text); padding: 1px 5px; border-radius: 4px; width: fit-content; margin-bottom: 2px; border: 1px solid var(--border); }
    .broker-shares { font-size: 12px; font-weight: 700; color: var(--text); }
    .broker-subtext { font-size: 10px; font-weight: 600; color: var(--muted); }
    .broker-val { font-family: var(--font-mono); font-size: 13px; font-weight: 800; color: var(--text); }
    .broker-pnl-val { font-family: var(--font-mono); font-size: 11px; font-weight: 800; }

    .form-group { margin-bottom: 8px; }
    .form-label { display: block; font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
    .form-input { width: 100%; padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-family: var(--font-sans); font-size: 13px; font-weight: 600; background: var(--surface); color: var(--text); outline: none; }
    .form-input:focus { border-color: var(--success); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .custom-select-trigger { width: 100%; padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .custom-select-trigger::after { content: "▼"; font-size: 9px; color: var(--muted); }

    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border: none; border-radius: 8px; font-family: var(--font-sans); font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-primary { background: var(--text); color: var(--card-bg); width: 100%; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: #FFF; }

    .calc-mode-toggle { display: flex; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
    .calc-mode-btn { flex: 1; padding: 7px; font-family: var(--font-sans); font-size: 10px; font-weight: 800; text-transform: uppercase; border: none; background: transparent; color: var(--muted); cursor: pointer; }
    .calc-mode-btn.active { background: var(--text); color: var(--card-bg); }

    .result-card { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-top: 8px; }
    .result-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .result-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .result-value { font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
    .result-highlight { font-size: 16px; font-weight: 800; color: var(--success); }

    .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; z-index: 100; height: 54px; }
    .tab-btn { flex: 1; padding: 4px; background: none; border: none; cursor: pointer; font-size: 9px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-transform: uppercase; }
    .tab-btn.active { color: var(--text); font-weight: 900; }
    .tab-btn svg { width: 18px; height: 18px; stroke-width: 2.2; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; align-items: flex-end; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal-sheet { background: var(--card-bg); color: var(--text); width: 100%; max-width: 500px; border-radius: 14px 14px 0 0; padding: 12px; animation: slideUp 0.2s ease-out; border-top: 1px solid var(--border); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 32px; height: 3px; background: var(--border); border-radius: 2px; margin: 0 auto 10px; }

    .toast { position: fixed; top: 45px; left: 50%; transform: translateX(-50%) translateY(-20px); padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; z-index: 999; opacity: 0; transition: all 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-success { background: var(--success); color: #FFF; }
    .toast-error { background: var(--danger); color: #FFF; }

    .select-list-modal { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; max-height: 220px; overflow-y: auto; }
    .select-list-item { padding: 10px; border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: var(--surface); color: var(--text); }

    .tag-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .tag-chip { padding: 3px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; font-size: 10px; font-weight: 700; color: var(--text); cursor: pointer; }

    .install-banner { display: none; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; }
    .install-banner.show { display: flex; }
  </style>
</head>
<body>

<header class="global-header">
  <h1 class="claude-serif">&#8377; NSE Portfolio Tracker</h1>
  <div class="header-actions">
    <button class="theme-toggle-btn" onclick="window._app.fetchLivePrices()">🔄 Sync</button>
    <button class="theme-toggle-btn" id="theme-btn" onclick="window._app.toggleTheme()">☀️ Light</button>
  </div>
</header>

<div class="container">
  <div id="pwa-banner" class="install-banner">
    <span>📱 Install App on Home Screen</span>
    <button class="btn btn-sm" style="background:var(--text);color:var(--card-bg);padding:3px 6px;font-size:9px;" onclick="window._app.installPWA()">Install</button>
  </div>

  <div id="tab-portfolio" class="tab-content"></div>
  <div id="tab-calculator" class="tab-content" style="display:none;"></div>
  <div id="tab-add" class="tab-content" style="display:none;"></div>
  <div id="tab-history" class="tab-content" style="display:none;"></div>
  <div id="tab-settings" class="tab-content" style="display:none;"></div>
</div>

<nav class="tabs">
  <button class="tab-btn active" onclick="window._app.switchTab('portfolio')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Portfolio
  </button>
  <button class="tab-btn" onclick="window._app.switchTab('calculator')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
    Calculator
  </button>
  <button class="tab-btn" onclick="window._app.switchTab('add')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Add
  </button>
  <button class="tab-btn" onclick="window._app.switchTab('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    History
  </button>
  <button class="tab-btn" onclick="window._app.switchTab('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Settings
  </button>
</nav>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)window._app.closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var STORAGE_KEY = "stocktrack_nse_v2";
  var THEME_KEY = "stocktrack_theme";

  function getState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return {
      holdings: [
        { ticker: "SUZLON", broker: "Kite", shares: 3141, avgPrice: 53.22, currentPrice: 46.69 }
      ],
      transactions: [
        { type: "BUY", ticker: "SUZLON", broker: "Kite", shares: 3141, price: 53.22, date: "2026-08-20" }
      ],
      usedBrokers: ["Kite", "Groww", "Upstox", "Zerodha"]
    };
  }

  function saveState(s) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
  }

  function initTheme() {
    var savedTheme = localStorage.getItem(THEME_KEY) || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    var btn = document.getElementById("theme-btn");
    if (btn) btn.textContent = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark";
  }

  var state = getState();
  var selectedCalcHolding = null;
  var deferredPrompt = null;

  function fmt(val) {
    return "\u20B9" + Number(val).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtShort(val) {
    if (Math.abs(val) >= 10000000) return "\u20B9" + (val/10000000).toFixed(2) + " Cr";
    if (Math.abs(val) >= 100000) return "\u20B9" + (val/100000).toFixed(2) + " L";
    return fmt(val);
  }

  function showToast(msg, type) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast toast-" + (type||"success") + " show";
    setTimeout(function(){ t.className = "toast"; }, 2000);
  }

  function escHtml(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function getGroupedHoldings() {
    var groups = {};
    state.holdings.forEach(function(h) {
      if (!groups[h.ticker]) groups[h.ticker] = [];
      groups[h.ticker].push(h);
    });
    return groups;
  }

  function getHoldingByTickerBroker(ticker, broker) {
    for (var i = 0; i < state.holdings.length; i++) {
      if (state.holdings[i].ticker === ticker && state.holdings[i].broker === broker) return state.holdings[i];
    }
    return null;
  }

  function getPnlColorClass(val) { return val >= 0 ? "pnl-blue" : "pnl-red"; }
  function getValColorClass(val) { return val >= 0 ? "val-blue" : "val-red"; }
  function sign(val) { return val >= 0 ? "+" : ""; }

  function renderPortfolio() {
    var el = document.getElementById("tab-portfolio");
    var groups = getGroupedHoldings();
    var totalValue = 0, totalInvested = 0;

    state.holdings.forEach(function(h) {
      totalValue += h.shares * h.currentPrice;
      totalInvested += h.shares * h.avgPrice;
    });
    var totalPnl = totalValue - totalInvested;
    var totalPnlPct = totalInvested > 0 ? (totalPnl / totalInvested * 100) : 0;

    var html = `
      <div class="card">
        <div class="hero-grid">
          <div class="hero-item" style="grid-column:1/3;">
            <div class="hero-label">Total Portfolio Value</div>
            <div class="hero-value">${fmt(totalValue)}</div>
          </div>
          <div class="hero-item">
            <div class="hero-label">Total P&L</div>
            <div class="hero-value ${getValColorClass(totalPnl)} sm">${sign(totalPnl)}${fmt(totalPnl)}</div>
            <div class="hero-value ${getValColorClass(totalPnl)}" style="font-size:11px;margin-top:2px;">${sign(totalPnlPct)}${totalPnlPct.toFixed(2)}%</div>
          </div>
          <div class="hero-item">
            <div class="hero-label">Invested</div>
            <div class="hero-value sm">${fmtShort(totalInvested)}</div>
          </div>
        </div>
      </div>
    `;

    var tickers = Object.keys(groups).sort();
    if (tickers.length === 0) {
      html += '<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px;">No holdings yet. Add your first position!</div>';
    }

    tickers.forEach(function(ticker) {
      var entries = groups[ticker];
      var sumInvested = 0, sumValue = 0;
      entries.forEach(function(e){ sumInvested += e.shares * e.avgPrice; sumValue += e.shares * e.currentPrice; });
      var sumPnl = sumValue - sumInvested;
      var sumPnlPct = sumInvested > 0 ? (sumPnl / sumInvested * 100) : 0;

      html += `
        <div class="ticker-group">
          <div class="ticker-header">
            <span class="ticker-name">${escHtml(ticker)}</span>
            <div class="ticker-total ${getPnlColorClass(sumPnl)}">${sign(sumPnl)}${fmt(sumPnl)} (${sign(sumPnlPct)}${sumPnlPct.toFixed(2)}%)</div>
          </div>
      `;

      entries.forEach(function(entry) {
        var inv = entry.shares * entry.avgPrice;
        var val = entry.shares * entry.currentPrice;
        var pnl = val - inv;
        var pnlPct = inv > 0 ? (pnl / inv * 100) : 0;
        var safeT = escHtml(entry.ticker).replace(/'/g, "\\'");
        var safeB = escHtml(entry.broker).replace(/'/g, "\\'");

        html += `
          <div class="broker-row" onclick="window._app.editHolding('${safeT}','${safeB}')">
            <div>
              <span class="broker-tag">${escHtml(entry.broker)}</span>
              <div class="broker-shares">${entry.shares} <span class="broker-subtext">shares</span></div>
              <div class="broker-subtext">Avg ${fmt(entry.avgPrice)} &middot; Cur ${fmt(entry.currentPrice)}</div>
            </div>
            <div style="text-align:right;">
              <div class="broker-val">${fmt(val)}</div>
              <div class="broker-pnl-val ${getPnlColorClass(pnl)}">${sign(pnl)}${fmt(pnl)} (${sign(pnlPct)}${pnlPct.toFixed(2)}%)</div>
              <div class="broker-subtext">Inv ${fmtShort(inv)}</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
    });

    el.innerHTML = html;
  }

  function renderCalculator() {
    var el = document.getElementById("tab-calculator");
    var selectText = selectedCalcHolding ? `${selectedCalcHolding.ticker} (${selectedCalcHolding.broker}) - ${selectedCalcHolding.shares} @ ${fmt(selectedCalcHolding.avgPrice)}` : "-- Choose a holding --";

    el.innerHTML = `
      <div class="card">
        <div class="card-title" style="margin-bottom:8px;">Average Price Calculator</div>
        <div class="calc-mode-toggle">
          <button class="calc-mode-btn active" id="calc-mode-new" onclick="window._app.calcSwitchMode('new')">New Stock</button>
          <button class="calc-mode-btn" id="calc-mode-add" onclick="window._app.calcSwitchMode('add')">Add to Existing</button>
        </div>

        <div id="calc-mode-portfolio" style="display:none;" class="form-group">
          <label class="form-label">Select from Portfolio</label>
          <div class="custom-select-trigger" onclick="window._app.openHoldingSelector()">${escHtml(selectText)}</div>
        </div>

        <div id="calc-mode-ticker" class="form-group">
          <label class="form-label">Stock Ticker</label>
          <input type="text" class="form-input" id="calc-ticker" placeholder="e.g. RELIANCE" autocomplete="off">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Investment Amount (₹)</label>
            <input type="number" class="form-input" id="calc-investment" placeholder="e.g. 50000">
          </div>
          <div class="form-group">
            <label class="form-label">Entry Price (₹)</label>
            <input type="number" class="form-input" id="calc-entry" placeholder="e.g. 56.00">
          </div>
        </div>

        <button class="btn btn-primary" onclick="window._app.calcCalculate()">Calculate Average</button>
      </div>
      <div id="calc-results"></div>
    `;
  }

  function renderAdd() {
    var el = document.getElementById("tab-add");
    var brokers = state.usedBrokers || [];
    el.innerHTML = `
      <div class="card">
        <div class="card-title" style="margin-bottom:8px;">Add New Stock Holding</div>
        <div class="form-group">
          <label class="form-label">Stock Ticker</label>
          <input type="text" class="form-input" id="add-ticker" placeholder="e.g. IDEA, RELIANCE" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">Broker</label>
          <input type="text" class="form-input" id="add-broker" placeholder="e.g. Kite, Groww, Upstox" autocomplete="off">
          <div class="tag-list">
            ${brokers.map(b => `<span class="tag-chip" onclick="document.getElementById('add-broker').value='${escHtml(b)}'">${escHtml(b)}</span>`).join('')}
          </div>
        </div>
        <div class="form-row" style="margin-top:8px;">
          <div class="form-group">
            <label class="form-label">Shares</label>
            <input type="number" class="form-input" id="add-shares" placeholder="0">
          </div>
          <div class="form-group">
            <label class="form-label">Buy Price (₹)</label>
            <input type="number" class="form-input" id="add-price" placeholder="0.00">
          </div>
        </div>
        <button class="btn btn-primary" style="margin-top:6px;" onclick="window._app.addSubmit()">Add to Portfolio</button>
      </div>
    `;
  }

  function renderHistory() {
    var el = document.getElementById("tab-history");
    var txns = (state.transactions || []).slice().reverse();
    var html = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Transaction History</div>
          <button class="btn btn-outline btn-sm" onclick="window._app.clearHistory()">Clear</button>
        </div>
        <div>
    `;
    if (txns.length === 0) html += '<div style="text-align:center;padding:15px;color:var(--muted);font-size:11px;">No transactions recorded.</div>';
    txns.forEach(function(tx, idx) {
      var origIdx = state.transactions.length - 1 - idx;
      html += `
        <div class="broker-row">
          <div>
            <span class="broker-tag" style="background:var(--success);color:#FFF;">${tx.type}</span>
            <div style="font-size:12px;font-weight:800;color:var(--text);">${escHtml(tx.ticker)} (${escHtml(tx.broker)})</div>
            <div class="broker-subtext">${tx.shares} shares @ ${fmt(tx.price)}</div>
          </div>
          <div style="text-align:right;">
            <div class="broker-val">${fmt(tx.shares * tx.price)}</div>
            <div class="broker-subtext">${tx.date}</div>
            <button style="background:none;border:none;color:var(--danger);font-size:10px;font-weight:700;margin-top:2px;cursor:pointer;" onclick="window._app.deleteTx(${origIdx})">Delete</button>
          </div>
        </div>
      `;
    });
    html += `</div></div>`;
    el.innerHTML = html;
  }

  function renderSettings() {
    var el = document.getElementById("tab-settings");
    el.innerHTML = `
      <div class="card">
        <div class="card-title" style="margin-bottom:6px;">Data & Backup</div>
        <p style="font-size:11px;color:var(--muted);margin-bottom:10px;">Export or restore your portfolio data safely.</p>
        <div class="hero-grid" style="margin-bottom:10px;">
          <div class="hero-item" style="text-align:center;"><div class="hero-value sm">${state.holdings.length}</div><div class="hero-label">Holdings</div></div>
          <div class="hero-item" style="text-align:center;"><div class="hero-value sm">${state.transactions.length}</div><div class="hero-label">Transactions</div></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn btn-primary" onclick="window._app.exportJSON()">Export Backup (JSON)</button>
          <button class="btn btn-primary" onclick="window._app.exportCSV()">Export Holdings (CSV)</button>
          <label class="btn btn-outline" style="cursor:pointer;text-align:center;">Restore Backup (JSON)<input type="file" accept=".json" onchange="window._app.importJSON(this)" style="display:none;"></label>
          <button class="btn btn-danger" style="margin-top:4px;" onclick="window._app.clearAllData()">Clear All Data</button>
        </div>
      </div>
    `;
  }

  window._app = {
    fetchLivePrices: function() {
      // Yahan apna Poora Google Apps Script Web App Deployment URL daalein:
      var API_URL = "https://script.google.com/macros/s/AKfycbwhFi2PJu9-a8Y2YPZ8c-t6Ydpz1dKXXazWseUKr9Xfm55WIiDZ1W0BTIValV2sqWBLgw/exec"; // <-- Make sure it ends with /exec

      if (!API_URL || API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE")) {
        showToast("Set valid Google Script URL first!", "error");
        return;
      }

      showToast("Fetching live prices...");

      // Added redirect: 'follow' for handling Google Apps Script 302 redirect smoothly
      fetch(API_URL, { redirect: 'follow' })
        .then(function(res) { 
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json(); 
        })
        .then(function(prices) {
          var updatedCount = 0;
          state.holdings.forEach(function(h) {
            var symbol = h.ticker.toUpperCase().trim();
            if (prices[symbol] !== undefined && !isNaN(prices[symbol])) {
              h.currentPrice = parseFloat(prices[symbol]);
              updatedCount++;
            }
          });
          saveState(state);
          renderPortfolio();
          showToast("Updated " + updatedCount + " prices!");
        })
        .catch(function(err) {
          console.error(err);
          showToast("Fetch failed! Check Script URL / Permissions", "error");
        });
    },

    toggleTheme: function() {
      var currentTheme = document.documentElement.getAttribute("data-theme") || "dark";
      var nextTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nextTheme);
      localStorage.setItem(THEME_KEY, nextTheme);
      var btn = document.getElementById("theme-btn");
      if (btn) btn.textContent = nextTheme === "dark" ? "☀️ Light" : "🌙 Dark";
      renderPortfolio();
    },

    switchTab: function(name) {
      var tabs = ["portfolio","calculator","add","history","settings"];
      tabs.forEach(function(t, idx) {
        var el = document.getElementById("tab-" + t);
        if (el) el.style.display = (t === name) ? "block" : "none";
        document.querySelectorAll(".tab-btn")[idx].classList.toggle("active", t === name);
      });
      if (name === "portfolio") renderPortfolio();
      if (name === "calculator") renderCalculator();
      if (name === "add") renderAdd();
      if (name === "history") renderHistory();
      if (name === "settings") renderSettings();
    },

    calcSwitchMode: function(mode) {
      document.getElementById("calc-mode-new").classList.toggle("active", mode === "new");
      document.getElementById("calc-mode-add").classList.toggle("active", mode === "add");
      document.getElementById("calc-mode-portfolio").style.display = (mode === "add") ? "block" : "none";
      document.getElementById("calc-mode-ticker").style.display = (mode === "new") ? "block" : "none";
      document.getElementById("calc-results").innerHTML = "";
      if (mode === "new") selectedCalcHolding = null;
    },

    openHoldingSelector: function() {
      var html = '<div class="card-title">Select Position to Average</div><div class="select-list-modal">';
      state.holdings.forEach(function(h) {
        var safeT = escHtml(h.ticker).replace(/'/g, "\\'");
        var safeB = escHtml(h.broker).replace(/'/g, "\\'");
        html += `
          <div class="select-list-item" onclick="window._app.chooseHolding('${safeT}','${safeB}')">
            <div><strong>${escHtml(h.ticker)}</strong> <span class="broker-tag">${escHtml(h.broker)}</span></div>
            <div style="font-family:var(--font-mono);font-size:12px;font-weight:700;">${h.shares} @ ${fmt(h.avgPrice)}</div>
          </div>
        `;
      });
      html += '</div><button class="btn btn-outline" style="width:100%;" onclick="window._app.closeModal()">Cancel</button>';
      document.getElementById("modal-content").innerHTML = html;
      document.getElementById("modal-overlay").classList.add("show");
    },

    chooseHolding: function(ticker, broker) {
      var h = getHoldingByTickerBroker(ticker, broker);
      if (h) {
        selectedCalcHolding = h;
        window._app.closeModal();
        renderCalculator();
        window._app.calcSwitchMode("add");
      }
    },

    calcCalculate: function() {
      var isAdd = document.getElementById("calc-mode-add").classList.contains("active");
      var ticker = "", broker = "Groww", current = null;

      if (isAdd) {
        if (!selectedCalcHolding) { showToast("Select a holding first", "error"); return; }
        ticker = selectedCalcHolding.ticker;
        broker = selectedCalcHolding.broker;
        current = { shares: selectedCalcHolding.shares, avgPrice: selectedCalcHolding.avgPrice, totalCost: selectedCalcHolding.shares * selectedCalcHolding.avgPrice };
      } else {
        ticker = (document.getElementById("calc-ticker").value || "").toUpperCase().trim();
      }

      if (!ticker) { showToast("Enter ticker symbol", "error"); return; }

      var amount = parseFloat(document.getElementById("calc-investment").value);
      var price = parseFloat(document.getElementById("calc-entry").value);

      if (!(amount > 0) || !(price > 0)) { showToast("Enter valid amount & price", "error"); return; }

      var shares = Math.floor(amount / price);
      var actualInv = shares * price;
      if (shares === 0) { showToast("Amount too small for 1 share", "error"); return; }

      var totalShares = (isAdd && current) ? (current.shares + shares) : shares;
      var totalCost = (isAdd && current) ? (current.totalCost + actualInv) : actualInv;
      var avgPrice = totalCost / totalShares;

      var safeT = escHtml(ticker).replace(/'/g, "\\'");
      var safeB = escHtml(broker).replace(/'/g, "\\'");

      var html = `
        <div class="result-card">
          <div class="result-row"><span class="result-label">Position</span><span class="result-value" style="font-size:14px;font-weight:800;">${escHtml(ticker)} (${escHtml(broker)})</span></div>
          <div class="result-row"><span class="result-label">You Can Buy</span><span class="result-value" style="font-size:15px;font-weight:800;">${shares} shares</span></div>
          <div class="result-row"><span class="result-label">Total Cost</span><span class="result-value">${fmt(actualInv)}</span></div>
          <div class="result-row"><span class="result-label">New Average Price</span><span class="result-value result-highlight">${fmt(avgPrice)}</span></div>
          <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="window._app.calcApply('${safeT}','${safeB}',${shares},${price})">+ Add to Portfolio</button>
        </div>
      `;
      document.getElementById("calc-results").innerHTML = html;
    },

    calcApply: function(ticker, broker, shares, price) {
      broker = broker || "Groww";
      var h = getHoldingByTickerBroker(ticker, broker);
      state.transactions.push({ type: "BUY", ticker: ticker, broker: broker, shares: shares, price: price, date: new Date().toISOString().slice(0,10) });

      if (h) {
        var total = (h.shares * h.avgPrice) + (shares * price);
        h.shares += shares;
        h.avgPrice = total / h.shares;
      } else {
        state.holdings.push({ ticker: ticker, broker: broker, shares: shares, avgPrice: price, currentPrice: price });
      }
      if (!state.usedBrokers.includes(broker)) state.usedBrokers.push(broker);
      saveState(state);
      showToast("Added to portfolio!");
      window._app.switchTab("portfolio");
    },

    addSubmit: function() {
      var ticker = (document.getElementById("add-ticker").value || "").toUpperCase().trim();
      var broker = (document.getElementById("add-broker").value || "").trim() || "Groww";
      var shares = parseFloat(document.getElementById("add-shares").value);
      var price = parseFloat(document.getElementById("add-price").value);

      if (!ticker || !(shares > 0) || !(price > 0)) { showToast("Fill all fields correctly", "error"); return; }
      window._app.calcApply(ticker, broker, shares, price);
    },

    editHolding: function(ticker, broker) {
      var h = getHoldingByTickerBroker(ticker, broker);
      if (!h) return;
      var safeT = escHtml(ticker).replace(/'/g, "\\'");
      var safeB = escHtml(broker).replace(/'/g, "\\'");

      var html = `
        <div style="font-size:14px;font-weight:800;margin-bottom:8px;color:var(--text);">${escHtml(ticker)} (${escHtml(broker)})</div>
        <div class="form-group">
          <label class="form-label">Update Current Market Price (LTP)</label>
          <input type="number" class="form-input" id="edit-ltp" value="${h.currentPrice}" step="0.05">
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-outline" style="flex:1;" onclick="window._app.closeModal()">Cancel</button>
          <button class="btn btn-primary" style="flex:1;" onclick="window._app.saveEdit('${safeT}','${safeB}')">Update</button>
        </div>
        <button class="btn btn-danger" style="width:100%;margin-top:8px;font-size:10px;" onclick="window._app.deleteHolding('${safeT}','${safeB}')">Delete Position</button>
      `;
      document.getElementById("modal-content").innerHTML = html;
      document.getElementById("modal-overlay").classList.add("show");
    },

    saveEdit: function(ticker, broker) {
      var ltp = parseFloat(document.getElementById("edit-ltp").value);
      if (ltp > 0) {
        var h = getHoldingByTickerBroker(ticker, broker);
        if (h) h.currentPrice = ltp;
        saveState(state);
        window._app.closeModal();
        renderPortfolio();
        showToast("Price updated!");
      }
    },

    deleteHolding: function(ticker, broker) {
      if (!confirm("Delete this position?")) return;
      state.holdings = state.holdings.filter(x => !(x.ticker === ticker && x.broker === broker));
      saveState(state);
      window._app.closeModal();
      renderPortfolio();
      showToast("Position deleted");
    },

    deleteTx: function(idx) {
      state.transactions.splice(idx, 1);
      saveState(state);
      renderHistory();
    },

    clearHistory: function() {
      state.transactions = [];
      saveState(state);
      renderHistory();
    },

    closeModal: function() {
      document.getElementById("modal-overlay").classList.remove("show");
    },

    exportJSON: function() {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "stocktrack-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    },

    exportCSV: function() {
      var lines = ["Ticker,Broker,Shares,Avg Price,Current Price,Invested,Current Value"];
      state.holdings.forEach(function(h) {
        lines.push([h.ticker, h.broker, h.shares, h.avgPrice, h.currentPrice, (h.shares*h.avgPrice).toFixed(2), (h.shares*h.currentPrice).toFixed(2)].join(","));
      });
      var blob = new Blob([lines.join("\n")], { type: "text/csv" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "stocktrack-holdings.csv";
      a.click();
      URL.revokeObjectURL(url);
    },

    importJSON: function(input) {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var imported = JSON.parse(e.target.result);
          if (imported.holdings) {
            state = imported;
            saveState(state);
            showToast("Backup restored!");
            window._app.switchTab("portfolio");
          }
        } catch(err) { showToast("Invalid backup file", "error"); }
      };
      reader.readAsText(file);
    },

    clearAllData: function() {
      if (!confirm("Delete all data?")) return;
      state.holdings = [];
      state.transactions = [];
      saveState(state);
      showToast("All data cleared");
      window._app.switchTab("portfolio");
    },

    installPWA: function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById("pwa-banner").classList.remove("show");
        });
      }
    }
  };

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("pwa-banner").classList.add("show");
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  initTheme();
  window._app.switchTab("portfolio");
})();
</script>
</body>
</html>
